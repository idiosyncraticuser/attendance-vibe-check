<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%" aria-hidden="true" id="armored-button-frame">
  <defs>
    <style>
      :root {
        --im-titanium-dark: #0A0C0E;
        --im-titanium-mid: #161A20;
        --im-gunmetal: #1E232D;
        --im-steel-highlight: #4B5565;
        --im-cyan-bright: #00F0FF;
        --im-red-accent: #C41E3A;
      }
    </style>
    <linearGradient id="abf-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--im-steel-highlight)" />
      <stop offset="50%" stop-color="var(--im-gunmetal)" />
      <stop offset="100%" stop-color="var(--im-titanium-dark)" />
    </linearGradient>
  </defs>

  <!-- 1. BUTTON CHASSIS BASE -->
  <g id="button-chassis">
    <path d="M 40,12 L 760,12 L 788,40 L 788,160 L 760,188 L 40,188 L 12,160 L 12,40 Z" fill="var(--im-titanium-dark)" stroke="url(#abf-bevel)" stroke-width="6" />
    <path d="M 48,24 L 752,24 L 776,48 L 776,152 L 752,176 L 48,176 L 24,152 L 24,48 Z" fill="var(--im-titanium-mid)" stroke="var(--im-steel-highlight)" stroke-width="2" />
  </g>

  <!-- 2. ARMOR FLANGES & RED ACCENTS -->
  <g id="armor-flanges" fill="var(--im-gunmetal)" stroke="var(--im-titanium-dark)" stroke-width="2">
    <!-- Left Flange -->
    <polygon points="12,40 32,12 32,60 20,80" />
    <line x1="12" y1="40" x2="32" y2="12" stroke="var(--im-red-accent)" stroke-width="3" />
    <!-- Right Flange -->
    <polygon points="788,40 768,12 768,60 780,80" />
    <line x1="788" y1="40" x2="768" y2="12" stroke="var(--im-red-accent)" stroke-width="3" />
  </g>

  <!-- 3. STATUS RAIL -->
  <g id="status-rail">
    <line x1="60" y1="188" x2="740" y2="188" stroke="var(--im-cyan-bright)" stroke-width="2" stroke-dasharray="20 10" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 64" width="100%" height="100%" aria-hidden="true" id="mechanical-divider">
  <defs>
    <style>
      :root {
        --im-titanium-dark: #0A0C0E;
        --im-steel-highlight: #4B5565;
        --im-cyan-bright: #00F0FF;
        --im-red-accent: #C41E3A;
      }
    </style>
    <linearGradient id="md-wing-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(75,85,101,0)" />
      <stop offset="30%" stop-color="var(--im-steel-highlight)" />
      <stop offset="50%" stop-color="var(--im-cyan-bright)" />
      <stop offset="70%" stop-color="var(--im-steel-highlight)" />
      <stop offset="100%" stop-color="rgba(75,85,101,0)" />
    </linearGradient>
  </defs>

  <!-- 1. CENTER FUSION NODE -->
  <g id="center-fusion-node">
    <polygon points="400,12 424,32 400,52 376,32" fill="var(--im-titanium-dark)" stroke="var(--im-steel-highlight)" stroke-width="3" />
    <circle cx="400" cy="32" r="6" fill="var(--im-cyan-bright)" />
  </g>

  <!-- 2. TITANIUM WINGS -->
  <g id="titanium-wings" stroke="url(#md-wing-grad)" stroke-width="3">
    <line x1="40" y1="32" x2="368" y2="32" />
    <line x1="432" y1="32" x2="760" y2="32" />
  </g>

  <!-- 3. ENDCAP TICKS -->
  <g id="endcap-ticks" stroke="var(--im-cyan-bright)" stroke-width="2">
    <path d="M 40,20 L 40,44 M 20,32 L 40,32" />
    <path d="M 760,20 L 760,44 M 760,32 L 780,32" />
  </g>
</svg>

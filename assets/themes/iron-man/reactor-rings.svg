<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%" aria-hidden="true" id="reactor-rings">
  <defs>
    <style>
      :root {
        --im-titanium-dark: #0A0C0E;
        --im-titanium-mid: #161A20;
        --im-gunmetal: #1E232D;
        --im-steel-highlight: #4B5565;
        --im-cyan-bright: #00F0FF;
        --im-cyan-deep: #006699;
        --im-red-accent: #C41E3A;
      }
    </style>
    <linearGradient id="rr-steel-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--im-steel-highlight)" />
      <stop offset="50%" stop-color="var(--im-gunmetal)" />
      <stop offset="100%" stop-color="var(--im-titanium-dark)" />
    </linearGradient>
  </defs>

  <!-- 1. OUTER MACHINED RIM -->
  <g id="outer-machined-ring">
    <circle cx="512" cy="512" r="480" fill="none" stroke="url(#rr-steel-bevel)" stroke-width="16" />
    <circle cx="512" cy="512" r="460" fill="none" stroke="var(--im-titanium-dark)" stroke-width="4" />
    
    <!-- Perimeter Vents & Red Emergency Tabs -->
    <g transform="translate(512,512)">
      <line x1="0" y1="-488" x2="0" y2="-472" stroke="var(--im-cyan-bright)" stroke-width="4" />
      <line x1="0" y1="472" x2="0" y2="488" stroke="var(--im-cyan-bright)" stroke-width="4" />
      <line x1="-488" y1="0" x2="-472" y2="0" stroke="var(--im-cyan-bright)" stroke-width="4" />
      <line x1="472" y1="0" x2="488" y2="0" stroke="var(--im-cyan-bright)" stroke-width="4" />
      
      <rect x="-16" y="-484" width="32" height="6" rx="1" fill="var(--im-red-accent)" />
      <rect x="-16" y="478" width="32" height="6" rx="1" fill="var(--im-red-accent)" />
    </g>
  </g>

  <!-- 2. COIL TRACK RING -->
  <g id="coil-track-ring">
    <circle cx="512" cy="512" r="390" fill="none" stroke="var(--im-titanium-mid)" stroke-width="32" />
    <circle cx="512" cy="512" r="390" fill="none" stroke="var(--im-cyan-deep)" stroke-width="8" stroke-dasharray="160 40" />
    <circle cx="512" cy="512" r="372" fill="none" stroke="var(--im-steel-highlight)" stroke-width="2" />
  </g>

  <!-- 3. INNER APERTURE TRACK -->
  <g id="inner-aperture-track">
    <circle cx="512" cy="512" r="280" fill="none" stroke="url(#rr-steel-bevel)" stroke-width="14" />
    <circle cx="512" cy="512" r="268" fill="none" stroke="var(--im-cyan-bright)" stroke-width="2" stroke-dasharray="6 10" />
  </g>

  <!-- 4. LASER GUIDANCE TRACK -->
  <g id="laser-guidance-ring">
    <circle cx="512" cy="512" r="210" fill="none" stroke="var(--im-cyan-bright)" stroke-width="3" stroke-dasharray="140 10 30 10" />
    <circle cx="512" cy="512" r="195" fill="none" stroke="var(--im-steel-highlight)" stroke-width="1" stroke-dasharray="4 4" />
  </g>
</svg>

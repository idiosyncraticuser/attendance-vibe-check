<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%" aria-hidden="true" id="button-energy-active">
  <defs>
    <style>
      :root {
        --im-cyan-bright: #00F0FF;
        --im-cyan-glow: #A0F7FF;
        --im-cyan-deep: #006699;
      }
    </style>
    <linearGradient id="bea-plasma" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,240,255,0)" />
      <stop offset="25%" stop-color="var(--im-cyan-deep)" stop-opacity="0.4" />
      <stop offset="50%" stop-color="var(--im-cyan-glow)" stop-opacity="0.75" />
      <stop offset="75%" stop-color="var(--im-cyan-deep)" stop-opacity="0.4" />
      <stop offset="100%" stop-color="rgba(0,240,255,0)" />
    </linearGradient>
  </defs>

  <!-- 1. ACTIVE PLASMA FILL -->
  <g id="active-plasma-fill">
    <path d="M 40,12 L 760,12 L 788,40 L 788,160 L 760,188 L 40,188 L 12,160 L 12,40 Z" fill="url(#bea-plasma)" />
  </g>

  <!-- 2. HIGH ENERGY TRACES -->
  <g id="high-energy-traces" fill="none" stroke="var(--im-cyan-bright)" stroke-width="3">
    <path d="M 40,12 L 760,12 L 788,40 L 788,160 L 760,188 L 40,188 L 12,160 L 12,40 Z" stroke-dasharray="80 20" />
    <line x1="0" y1="100" x2="800" y2="100" stroke="var(--im-cyan-glow)" stroke-width="1.5" stroke-dasharray="12 12" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%" aria-hidden="true" id="hud-scan-rings">
  <defs>
    <style>
      :root {
        --im-steel-highlight: #4B5565;
        --im-cyan-bright: #00F0FF;
        --im-red-accent: #C41E3A;
      }
    </style>
  </defs>

  <!-- 1. OUTER SCAN TRACK -->
  <g id="outer-scan-track" fill="none" stroke="var(--im-cyan-bright)" stroke-width="3">
    <circle cx="512" cy="512" r="460" stroke-dasharray="180 30 90 30" />
  </g>

  <!-- 2. SEGMENTED MID TRACK -->
  <g id="segmented-mid-track" fill="none" stroke="var(--im-steel-highlight)" stroke-width="5">
    <circle cx="512" cy="512" r="360" stroke-dasharray="200 60 40 60" />
  </g>

  <!-- 3. INNER RADAR TRACK -->
  <g id="inner-radar-track" fill="none" stroke="var(--im-red-accent)" stroke-width="2">
    <circle cx="512" cy="512" r="260" stroke-dasharray="50 15" />
    <circle cx="512" cy="512" r="240" stroke="var(--im-cyan-bright)" stroke-width="1" stroke-dasharray="6 6" />
  </g>
</svg>

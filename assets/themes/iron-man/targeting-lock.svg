<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" aria-hidden="true" id="targeting-lock">
  <defs>
    <style>
      :root {
        --im-steel-highlight: #4B5565;
        --im-cyan-bright: #00F0FF;
        --im-red-accent: #C41E3A;
      }
    </style>
  </defs>

  <!-- 1. CONVERGING BRACKETS -->
  <g id="converging-brackets" fill="none" stroke="var(--im-red-accent)" stroke-width="6" stroke-linejoin="miter">
    <path d="M 96,160 L 96,96 L 160,96" />
    <path d="M 352,96 L 416,96 L 416,160" />
    <path d="M 416,352 L 416,416 L 352,416" />
    <path d="M 160,416 L 96,416 L 96,352" />
  </g>

  <!-- 2. CENTRAL LOCK DIAMOND -->
  <g id="central-lock-diamond" fill="none" stroke="var(--im-steel-highlight)" stroke-width="3">
    <polygon points="256,176 336,256 256,336 176,256" />
    <circle cx="256" cy="256" r="40" stroke="var(--im-cyan-bright)" stroke-width="2" />
  </g>

  <!-- 3. FOCAL NODE -->
  <g id="focal-node">
    <circle cx="256" cy="256" r="8" fill="var(--im-red-accent)" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%" aria-hidden="true" id="reality-crack">
  <defs>
    <style>
      :root {
        --thanos-purple: #3B1566;
        --thanos-gold: #C5A059;
        --thanos-white: #FFFFFF;
      }
    </style>
  </defs>

  <g id="crack-glow-underlay" stroke="var(--thanos-purple)" stroke-width="16" fill="none" opacity="0.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 512,512 L 380,320 L 220,280 L 80,120 M 380,320 L 410,180 M 512,512 L 680,400 L 820,420 L 960,300 M 680,400 L 720,220 M 512,512 L 480,700 L 320,800 L 160,940 M 480,700 L 600,820 L 780,920" />
  </g>

  <g id="primary-fractures" stroke="var(--thanos-gold)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 512,512 L 380,320 L 220,280 L 80,120 M 380,320 L 410,180 M 512,512 L 680,400 L 820,420 L 960,300 M 680,400 L 720,220 M 512,512 L 480,700 L 320,800 L 160,940 M 480,700 L 600,820 L 780,920" />
  </g>

  <g id="secondary-tendrils" stroke="var(--thanos-white)" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M 512,512 L 380,320 L 220,280 L 80,120 M 380,320 L 410,180 M 512,512 L 680,400 L 820,420 L 960,300 M 680,400 L 720,220 M 512,512 L 480,700 L 320,800 L 160,940 M 480,700 L 600,820 L 780,920" />
    <path d="M 220,280 L 180,360 M 820,420 L 880,500 M 320,800 L 260,740" />
  </g>

  <g id="shatter-nodes" fill="var(--thanos-white)">
    <circle cx="512" cy="512" r="6" />
    <circle cx="380" cy="320" r="4" />
    <circle cx="680" cy="400" r="4" />
    <circle cx="480" cy="700" r="4" />
  </g>
</svg>

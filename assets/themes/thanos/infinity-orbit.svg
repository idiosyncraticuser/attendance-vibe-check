<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%" aria-hidden="true" id="infinity-orbit">
  <defs>
    <style>
      :root {
        --thanos-violet: #1A0B2E;
        --thanos-purple: #3B1566;
        --thanos-gold: #C5A059;
        --thanos-white: #FFFFFF;
      }
    </style>
  </defs>

  <!-- Outer Orbit Layer -->
  <g id="outer-orbit" fill="none" stroke="var(--thanos-gold)" stroke-width="1.5" opacity="0.7">
    <circle cx="512" cy="512" r="460" stroke-dasharray="120 40 10 40 30 40" />
    <circle cx="512" cy="512" r="440" stroke="var(--thanos-purple)" stroke-width="3" stroke-dasharray="300 80" />
  </g>

  <!-- Mid Orbit Layer -->
  <g id="mid-orbit" fill="none" stroke="var(--thanos-gold)" stroke-width="2" opacity="0.85">
    <circle cx="512" cy="512" r="350" stroke-dasharray="12 12" />
    <path d="M 162,512 A 350,350 0 0,1 862,512" stroke="var(--thanos-white)" stroke-width="1" />
    <polygon points="512,142 522,162 502,162" fill="var(--thanos-gold)" />
    <polygon points="512,882 522,862 502,862" fill="var(--thanos-gold)" />
  </g>

  <!-- Inner Orbit Layer -->
  <g id="inner-orbit" fill="none" stroke="var(--thanos-purple)" stroke-width="2">
    <circle cx="512" cy="512" r="240" stroke-dasharray="180 20" />
    <circle cx="512" cy="512" r="220" stroke="var(--thanos-gold)" stroke-width="1" stroke-dasharray="6 6" />
  </g>

  <!-- Celestial Nodes -->
  <g id="orbital-nodes" fill="var(--thanos-gold)">
    <circle cx="512" cy="52" r="6" />
    <circle cx="972" cy="512" r="6" />
    <circle cx="512" cy="972" r="6" />
    <circle cx="52" cy="512" r="6" />
    <circle cx="759" cy="265" r="4" fill="var(--thanos-white)" />
    <circle cx="265" cy="759" r="4" fill="var(--thanos-white)" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%" aria-hidden="true" id="reality-distortion">
  <defs>
    <style>
      :root {
        --thanos-violet: #1A0B2E;
        --thanos-purple: #3B1566;
        --thanos-gold: #C5A059;
      }
    </style>
  </defs>

  <g id="lensing-grid" stroke="var(--thanos-purple)" stroke-width="1" fill="none" opacity="0.4">
    <path d="M 0,0 C 300,200 300,800 0,1024 M 1024,0 C 724,200 724,800 1024,1024" />
    <path d="M 0,0 C 200,300 800,300 1024,0 M 0,1024 C 200,724 800,724 1024,1024" />
  </g>

  <g id="warped-rings" fill="none" stroke="var(--thanos-gold)" stroke-width="1.5" opacity="0.6">
    <path d="M 112,512 C 112,200 200,112 512,112 C 824,112 912,200 912,512 C 912,824 824,912 512,912 C 200,912 112,824 112,512 Z" />
    <path d="M 262,512 C 262,350 350,262 512,262 C 674,262 762,350 762,512 C 762,674 674,762 512,762 C 350,762 262,674 262,512 Z" stroke-dasharray="10 6" />
  </g>

  <g id="gravitational-vortex" fill="none" stroke="var(--thanos-violet)" stroke-width="3">
    <circle cx="512" cy="512" r="50" stroke="var(--thanos-gold)" stroke-width="2" />
    <path d="M 512,512 Q 600,400 700,450 T 850,300" />
    <path d="M 512,512 Q 400,600 300,550 T 150,700" />
  </g>
</svg>

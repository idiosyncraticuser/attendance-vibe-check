<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" aria-hidden="true" id="snap-focus">
  <defs>
    <style>
      :root {
        --thanos-purple: #3B1566;
        --thanos-gold: #C5A059;
        --thanos-white: #FFFFFF;
      }
    </style>
    <radialGradient id="sf-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--thanos-white)" />
      <stop offset="30%" stop-color="var(--thanos-gold)" opacity="0.8" />
      <stop offset="70%" stop-color="var(--thanos-purple)" opacity="0.4" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>
  </defs>

  <!-- Converging Energy Vectors -->
  <g id="converging-vectors" stroke="var(--thanos-gold)" stroke-width="2" opacity="0.8">
    <path d="M 32,256 L 216,256 M 480,256 L 296,256" stroke-width="3" />
    <path d="M 256,32 L 256,216 M 256,480 L 256,296" stroke-width="3" />
    <path d="M 98,98 L 220,220 M 414,414 L 292,292" />
    <path d="M 414,98 L 292,220 M 98,414 L 220,292" />
  </g>

  <!-- Focus Target Rings -->
  <g id="focus-rings" fill="none" stroke="var(--thanos-white)">
    <circle cx="256" cy="256" r="120" stroke="var(--thanos-purple)" stroke-width="4" stroke-dasharray="20 10" />
    <circle cx="256" cy="256" r="80" stroke="var(--thanos-gold)" stroke-width="2" />
    <circle cx="256" cy="256" r="40" stroke="var(--thanos-white)" stroke-width="1.5" stroke-dasharray="6 4" />
  </g>

  <!-- Pinch Core Node -->
  <g id="pinch-node">
    <circle cx="256" cy="256" r="50" fill="url(#sf-glow)" />
    <circle cx="256" cy="256" r="8" fill="var(--thanos-white)" />
  </g>

  <!-- Spark Particles -->
  <g id="particle-sparks" fill="var(--thanos-gold)">
    <circle cx="230" cy="240" r="2" />
    <circle cx="280" cy="270" r="3" />
    <circle cx="270" cy="230" r="1.5" fill="var(--thanos-white)" />
    <circle cx="240" cy="280" r="2" fill="var(--thanos-white)" />
  </g>
</svg>
